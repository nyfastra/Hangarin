{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="content">
    <div class="container-fluid">
        <h4 class="page-title">Categories</h4>
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">List of Categories</div>
                        <div class="card-category">Page Subtitle</div>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="position-relative" style="max-width: 350px; width: 100%;">
                                <input type="text" class="form-control rounded-pill bg-light border-0 pr-4" placeholder="Search ...">
                                <i class="la la-search position-absolute" style="right: 15px; top: 50%; transform: translateY(-50%); color: #aaa;"></i>
                            </div>
                            <a href="{% url 'category-add' %}" class="btn btn-success btn-round px-4" style="border-radius: 20px;">
                                Add Category
                            </a>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-striped align-items-center">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for category in object_list %}
                                    <tr>
                                        <td>{{ category.name }}</td>
                                        <td>
                                            <a href="{% url 'category-update' category.id %}" class="text-primary mr-1">Edit</a>
                                            <a href="{% url 'category-delete' category.id %}" class="text-danger">Delete</a>
                                        </td>
                                    </tr>
                                    {% empty %}
                                    <tr>
                                        <td colspan="2" class="text-center text-muted">No categories found.</td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
