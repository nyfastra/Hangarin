{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="content">
    <div class="container-fluid">
        <h4 class="page-title">Notes</h4>
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header d-flex align-items-center justify-content-between">
                        <div>
                            <div class="card-title">Note List</div>
                            <div class="card-category">Manage your notes</div>
                        </div>
                        <a href="{% url 'note-add' %}" class="btn btn-primary btn-rounded">
                            <i class="la la-plus"></i> Add Note
                        </a>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-head-bg-primary table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>Title</th>
                                        <th>Content</th>
                                        <th class="text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for note in object_list %}
                                    <tr>
                                        <td>{{ note.title }}</td>
                                        <td>{{ note.content|truncatewords:10 }}</td>
                                        <td class="text-center">
                                            <a href="{% url 'note-update' note.id %}" class="btn btn-link btn-primary btn-just-icon mr-1" title="Edit">
                                                <i class="la la-edit"></i>
                                            </a>
                                            <a href="{% url 'note-delete' note.id %}" class="btn btn-link btn-danger btn-just-icon" title="Delete">
                                                <i class="la la-trash"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    {% empty %}
                                    <tr>
                                        <td colspan="3" class="text-center text-muted">No notes available.</td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
