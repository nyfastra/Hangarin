<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangarin - Task Management</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; display: flex; }
        .sidebar { width: 220px; background: #2c3e50; color: white; min-height: 100vh; padding: 20px; }
        .sidebar a { color: #ecf0f1; display: block; padding: 10px 0; text-decoration: none; }
        .sidebar a:hover { text-decoration: underline; }
        .content { flex-grow: 1; padding: 30px; }
        .btn { padding: 8px 12px; background: #3498db; color: white; text-decoration: none; border-radius: 4px; border: none; cursor: pointer; }
        .btn-danger { background: #e74c3c; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background: #f4f4f4; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Hangarin</h2>
        <a href="{% url 'task-list' %}">Tasks</a>
        <a href="{% url 'subtask-list' %}">Subtasks</a>
        <a href="{% url 'category-list' %}">Categories</a>
        <a href="{% url 'priority-list' %}">Priorities</a>
        <a href="{% url 'note-list' %}">Notes</a>
        <hr>
        {% if user.is_authenticated %}
            <p>User: {{ user.username }}</p>
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">Logout</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Login</a>
        {% endif %}
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
