{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="content">
    <div class="container-fluid">
        <h4 class="page-title">List of Priorities</h4>
        <div class="page-subtitle text-muted mb-4">Page Subtitle</div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-group p-0 m-0" style="max-width: 350px; width: 100%;">
                <div class="input-group">
                    <input type="text" class="form-control rounded-pill bg-light border-0" placeholder="Search ...">
                </div>
            </div>
            <a href="{% url 'priority-add' %}" class="btn btn-success btn-round px-4" style="border-radius: 20px;">
                Add Priority
            </a>
        </div>

        <div class="card border-0 shadow-none">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr class="text-muted border-0">
                                <th>Name</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for priority in object_list %}
                            <tr>
                                <td>{{ priority.name }}</td>
                                <td>
                                    <a href="{% url 'priority-update' priority.id %}" class="text-primary d-block">Edit</a>
                                    <a href="{% url 'priority-delete' priority.id %}" class="text-danger d-block">Delete</a>
                                </td>
                            </tr>
                            {% empty %}
                            <tr>
                                <td colspan="2" class="text-center text-muted">No priorities found.</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
