{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="content">
    <div class="container-fluid">
        <h4 class="page-title">Priorities</h4>
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header d-flex align-items-center justify-content-between">
                        <div>
                            <div class="card-title">Priority List</div>
                            <div class="card-category">Manage priorities</div>
                        </div>
                        <a href="{% url 'priority-add' %}" class="btn btn-primary btn-rounded">
                            <i class="la la-plus"></i> Add Priority
                        </a>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-head-bg-primary table-striped table-hover">
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th class="text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {% for priority in object_list %}
                                    <tr>
                                        <td>{{ priority.name }}</td>
                                        <td class="text-center">
                                            <a href="{% url 'priority-update' priority.id %}" class="btn btn-link btn-primary btn-just-icon mr-1" title="Edit">
                                                <i class="la la-edit"></i>
                                            </a>
                                            <a href="{% url 'priority-delete' priority.id %}" class="btn btn-link btn-danger btn-just-icon" title="Delete">
                                                <i class="la la-trash"></i>
                                            </a>
                                        </td>
                                    </tr>
                                    {% empty %}
                                    <tr>
                                        <td colspan="2" class="text-center text-muted">No priorities available.</td>
                                    </tr>
                                    {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
