{% extends 'core/base.html' %}
{% block content %}
<h2>Subtasks</h2>

<form method="get" style="display: flex; gap: 10px; margin-bottom: 15px;">
    <input type="text" name="q" placeholder="Search subtasks..." value="{{ request.GET.q }}">
    <select name="sort" onchange="this.form.submit()">
        <option value="">-- Sort By --</option>
        <option value="title" {% if request.GET.sort == 'title' %}selected{% endif %}>Title (A-Z)</option>
        <option value="-title" {% if request.GET.sort == '-title' %}selected{% endif %}>Title (Z-A)</option>
    </select>
    <button type="submit" class="btn">Filter</button>
</form>

<a href="{% url 'subtask-create' %}" class="btn">+ Add Subtask</a>
<table>
    <tr><th>Title</th><th>Task</th><th>Status</th><th>Actions</th></tr>
    {% for subtask in subtasks %}
    <tr>
        <td>{{ subtask.title }}</td>
        <td>{{ subtask.task }}</td>
        <td>{{ subtask.status }}</td>
        <td>
            <a href="{% url 'subtask-update' subtask.pk %}">Edit</a> |
            <a href="{% url 'subtask-delete' subtask.pk %}">Delete</a>
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No subtasks found.</td></tr>
    {% endfor %}
</table>
{% endblock %}
