{% extends 'core/base.html' %}
{% block content %}
<h2>Categories</h2>
<a href="{% url 'category-create' %}" class="btn">+ Add Category</a>
<table>
    <tr><th>Name</th><th>Actions</th></tr>
    {% for category in categories %}
    <tr>
        <td>{{ category.name }}</td>
        <td>
            <a href="{% url 'category-update' category.pk %}">Edit</a> |
            <a href="{% url 'category-delete' category.pk %}">Delete</a>
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="2">No categories found.</td></tr>
    {% endfor %}
</table>
{% endblock %}
