{% extends 'core/base.html' %}
{% block content %}
<h2>Tasks</h2>
<a href="{% url 'task-create' %}" class="btn">+ Add Task</a>

<form method="get" style="margin-top: 15px;">
    <input type="text" name="q" placeholder="Search tasks..." value="{{ request.GET.q }}">
    <button type="submit" class="btn">Search</button>
</form>

<table>
    <tr>
        <th>Title</th>
        <th>Status</th>
        <th>Priority</th>
        <th>Category</th>
        <th>Actions</th>
    </tr>
    {% for task in tasks %}
    <tr>
        <td>{{ task.title }}</td>
        <td>{{ task.status }}</td>
        <td>{{ task.priority }}</td>
        <td>{{ task.category }}</td>
        <td>
            <a href="{% url 'task-update' task.pk %}">Edit</a> |
            <a href="{% url 'task-delete' task.pk %}">Delete</a>
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="5">No tasks found.</td></tr>
    {% endfor %}
</table>
{% endblock %}
